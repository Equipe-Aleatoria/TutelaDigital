
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Responsável | Tutela Digital</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 { color: #155eef; }

    .aviso {
      padding: 14px;
      border-radius: 10px;
      background: #fff4d6;
      color: #795600;
      line-height: 1.5;
    }

    .pedido {
      margin-top: 16px;
      padding: 20px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 18px #172b4d0d;
    }

    .pedido h2 { margin-top: 0; }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff0c2;
      color: #795600;
      font-size: 13px;
      font-weight: bold;
    }

    .aprovado {
      background: #d9fbe7;
      color: #17663a;
    }

    .rejeitado {
      background: #ffe1e1;
      color: #a12222;
    }

    .acoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button, .voltar {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .aprovar { background: #16794b; color: white; }
    .rejeitar { background: #b42318; color: white; }

    .voltar {
      display: inline-block;
      margin-top: 20px;
      background: #e1eaff;
      color: #172b4d;
    }

    .vazio {
      padding: 24px;
      text-align: center;
      background: white;
      border-radius: 12px;
    }

    #mensagem {
      margin-top: 16px;
      font-weight: bold;
    }

    small { color: #667085; }
  </style>
</head>
<body>
  <main>
    <h1>Área do Responsável</h1>
    <p>Consulte os pedidos de PIX e registre sua decisão.</p>

    <div class="aviso">
      Protótipo demonstrativo: os pedidos e as decisões são
      armazenados no Supabase. Nenhuma transferência financeira
      é realizada.
    </div>

    <p id="mensagem" role="status"></p>
    <section id="lista" aria-live="polite"></section>

    <a class="voltar" href="index.html">Voltar ao início</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>

  <script>
    const lista = document.getElementById('lista');
    const mensagem = document.getElementById('mensagem');

    function adicionarDetalhe(card, texto) {
      const p = document.createElement('p');
      p.textContent = texto;
      card.appendChild(p);
    }

    async function carregarSolicitacoes() {
      mensagem.textContent = 'Carregando solicitações...';
      lista.replaceChildren();

      const { data: usuario, error: erroUsuario } =
        await supabaseClient.auth.getUser();

      if (erroUsuario || !usuario.user) {
        window.location.href = 'login.html';
        return;
      }

      const { data: solicitacoes, error } = await supabaseClient
        .from('solicitacoes')
        .select('id, destinatario, chave_pix, valor, motivo, status, criado_em')
        .eq('responsavel_id', usuario.user.id)
        .order('criado_em', { ascending: false });

      if (error) {
        console.error('Erro ao carregar:', error);
        mensagem.textContent = 'Erro ao carregar solicitações.';
        return;
      }

      mensagem.textContent = '';

      if (!solicitacoes || solicitacoes.length === 0) {
        const vazio = document.createElement('p');
        vazio.className = 'vazio';
        vazio.textContent = 'Nenhuma solicitação recebida até o momento.';
        lista.appendChild(vazio);
        return;
      }

      solicitacoes.forEach((pedido) => {
        const card = document.createElement('article');
        card.className = 'pedido';

        const titulo = document.createElement('h2');
        titulo.textContent = 'PIX para ' + pedido.destinatario;
        card.appendChild(titulo);

        const status = document.createElement('span');
        status.className = 'status';

        if (pedido.status === 'Aprovado') {
          status.classList.add('aprovado');
        }

        if (pedido.status === 'Rejeitado') {
          status.classList.add('rejeitado');
        }

        status.textContent = pedido.status;
        card.appendChild(status);

        const valor = Number(pedido.valor).toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });

        adicionarDetalhe(card, 'Valor: ' + valor);
        adicionarDetalhe(card, 'Chave PIX: ' + pedido.chave_pix);
        adicionarDetalhe(card, 'Motivo: ' + (pedido.motivo || 'Não informado'));
        adicionarDetalhe(
          card,
          'Data: ' + new Date(pedido.criado_em).toLocaleString('pt-BR')
        );

        if (pedido.status === 'Pendente') {
          const acoes = document.createElement('div');
          acoes.className = 'acoes';

          const aprovar = document.createElement('button');
          aprovar.className = 'aprovar';
          aprovar.textContent = 'Aprovar';

          const rejeitar = document.createElement('button');
          rejeitar.className = 'rejeitar';
          rejeitar.textContent = 'Rejeitar';

          async function executarDecisao(decisao) {
            aprovar.disabled = true;
            rejeitar.disabled = true;

            await decidir(pedido.id, decisao);

            aprovar.disabled = false;
            rejeitar.disabled = false;
          }

          aprovar.addEventListener('click', () => {
            executarDecisao('Aprovado');
          });

          rejeitar.addEventListener('click', () => {
            executarDecisao('Rejeitado');
          });

          acoes.append(aprovar, rejeitar);
          card.appendChild(acoes);
        }

        lista.appendChild(card);
      });
    }
function abrirTecladoVirtual() {
  return new Promise((resolver) => {
    const pares = ['0 ou 5', '1 ou 6', '2 ou 7', '3 ou 8', '4 ou 9'];
    const embaralhados = [...pares].sort(() => Math.random() - 0.5);

    let digitados = 0;

    const fundo = document.createElement('div');
    fundo.style.cssText = `
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    `;

    const painel = document.createElement('div');
    painel.style.cssText = `
      background: white;
      padding: 28px;
      border-radius: 16px;
      width: 320px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    `;

    const titulo = document.createElement('h2');
    titulo.textContent = 'Senha de autorização';

    const aviso = document.createElement('p');
    aviso.textContent = 'Simulação: selecione seis teclas para confirmar.';
    aviso.style.fontSize = '13px';

    const visor = document.createElement('p');
    visor.textContent = '○ ○ ○ ○ ○ ○';
    visor.style.fontSize = '24px';

    const teclado = document.createElement('div');
    teclado.style.cssText = `
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 20px 0;
    `;

    const confirmar = document.createElement('button');
    confirmar.textContent = 'Confirmar';
    confirmar.disabled = true;

    function atualizarVisor() {
      visor.textContent =
        '● '.repeat(digitados) +
        '○ '.repeat(6 - digitados);

      confirmar.disabled = digitados !== 6;
    }

    embaralhados.forEach((par) => {
      const tecla = document.createElement('button');
      tecla.textContent = par;
      tecla.style.cssText = `
        padding: 16px;
        font-size: 18px;
        border: 1px solid #ccd5e0;
        border-radius: 10px;
        cursor: pointer;
        background: #f0f5fa;
      `;

      tecla.onclick = () => {
        if (digitados < 6) {
          digitados++;
          atualizarVisor();
        }
      };

      teclado.appendChild(tecla);
    });

    const apagar = document.createElement('button');
    apagar.textContent = 'Apagar';
    apagar.onclick = () => {
      if (digitados > 0) {
        digitados--;
        atualizarVisor();
      }
    };

    const cancelar = document.createElement('button');
    cancelar.textContent = 'Cancelar';

    function fechar(resultado) {
      fundo.remove();
      resolver(resultado);
    }

    cancelar.onclick = () => fechar(false);
    confirmar.onclick = () => fechar(true);

    painel.append(
      titulo,
      aviso,
      visor,
      teclado,
      apagar,
      confirmar,
      cancelar
    );

    fundo.appendChild(painel);
    document.body.appendChild(fundo);
  });
}
    async function decidir(id, decisao) {
  if (decisao === 'Aprovado') {
    const autorizado = await abrirTecladoVirtual();

    if (!autorizado) {
      mensagem.textContent = 'Autorização cancelada.';
      return;
    }
  }

  mensagem.textContent = 'Registrando decisão...';

  const { error } = await supabaseClient.rpc(
    'decidir_solicitacao',
    {
      p_id: id,
      p_decisao: decisao
    }
  );

  if (error) {
    console.error('Erro ao decidir:', error);
    mensagem.textContent = 'Não foi possível registrar a decisão.';
    return;
  }

  await carregarSolicitacoes();
  mensagem.textContent = 'Decisão registrada com sucesso!';
}

    carregarSolicitacoes();
  </script>
</body>
</html>
