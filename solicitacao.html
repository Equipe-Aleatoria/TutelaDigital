
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar PIX | Tutela Digital</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #172b4d12;
    }

    h1 { color: #155eef; }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #ccd5e2;
      border-radius: 8px;
      font: inherit;
    }

    button, .voltar {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #155eef;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .voltar {
      background: #eaf0fb;
      color: #172b4d;
    }

    #mensagem {
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Solicitar PIX</h1>
    <p>Preencha os dados para enviar uma solicitação ao responsável.</p>

    <form id="formulario">
      <label for="destinatario">Nome do destinatário</label>
      <input id="destinatario" name="destinatario" required
             placeholder="Ex.: João da Silva">

      <label for="chave">Chave PIX fictícia</label>
      <input id="chave" name="chave" required
             placeholder="Use uma chave de teste">

      <label for="valor">Valor (R$)</label>
      <input id="valor" name="valor" type="number"
             min="0.01" max="100000" step="0.01" required
             placeholder="0,00">

      <label for="motivo">Motivo da solicitação</label>
      <textarea id="motivo" name="motivo" rows="3" required
                placeholder="Por que precisa fazer esse PIX?"></textarea>

      <button type="submit">Enviar para autorização</button>
    </form>

    <p id="mensagem" role="status"></p>

    <a class="voltar" href="index.html">Voltar ao início</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
 <script>
  document.getElementById('formulario').addEventListener(
    'submit',
    async function (event) {
      event.preventDefault();

      const mensagem = document.getElementById('mensagem');
      mensagem.textContent = 'Enviando solicitação...';

      // Identificar o solicitante autenticado
      const { data: usuario, error: erroUsuario } =
        await supabaseClient.auth.getUser();

      if (erroUsuario || !usuario.user) {
        mensagem.textContent = 'Faça login para continuar.';
        return;
      }

      // Descobrir o responsável vinculado
      const { data: vinculo, error: erroVinculo } =
        await supabaseClient
          .from('vinculos')
          .select('responsavel_id')
          .eq('solicitante_id', usuario.user.id)
          .limit(1)
          .maybeSingle();

      if (erroVinculo || !vinculo) {
        mensagem.textContent =
          'Nenhum responsável vinculado à sua conta.';
        console.error(erroVinculo);
        return;
      }
// Exibir teclado virtual antes de enviar o PIX fictício
const confirmado = await abrirTecladoVirtual();

if (!confirmado) {
  mensagem.textContent = 'Envio cancelado.';
  return;
}
      // Criar a solicitação no Supabase
      const { error: erroPedido } = await supabaseClient
        .from('solicitacoes')
        .insert({
          solicitante_id: usuario.user.id,
          responsavel_id: vinculo.responsavel_id,
          destinatario: document.getElementById('destinatario').value.trim(),
          chave_pix: document.getElementById('chave').value.trim(),
          valor: Number(document.getElementById('valor').value),
          motivo: document.getElementById('motivo').value.trim()
        });

      if (erroPedido) {
        mensagem.textContent = 'Erro ao enviar a solicitação.';
        console.error(erroPedido);
        return;
      }

      mensagem.textContent =
        'Solicitação enviada ao responsável com sucesso!';

      this.reset();
    }
  );
  function abrirTecladoVirtual() {
  return new Promise((resolver) => {
    const pares = [
      '0 ou 5',
      '1 ou 6',
      '2 ou 7',
      '3 ou 8',
      '4 ou 9'
    ];

    // Embaralhamento dos pares
    for (let i = pares.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pares[i], pares[j]] = [pares[j], pares[i]];
    }

    let digitados = 0;

    const fundo = document.createElement('div');
    fundo.style.cssText = `
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    `;

    const painel = document.createElement('div');
painel.style.cssText = `
  background: #ffffff;
  color: #142b49;
  padding: 32px 24px;
  border-radius: 22px;
  width: 380px;
  max-width: 94vw;
  text-align: center;
  box-shadow: 0 24px 70px rgba(0,0,0,0.4);
  border: 2px solid #dce6f2;
  font-family: Arial, sans-serif;
`;

    const titulo = document.createElement('h2');
    titulo.textContent = 'Confirmação do PIX';

    const aviso = document.createElement('p');
    aviso.textContent =
      'Simulação: selecione seis teclas para confirmar o envio.';
    aviso.style.fontSize = '13px';

    const visor = document.createElement('p');
    visor.style.cssText = 'font-size: 24px; margin: 20px 0;';

    const teclado = document.createElement('div');
    teclado.style.cssText = `
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 20px 0;
    `;

    const confirmar = document.createElement('button');
    confirmar.type = 'button';
    confirmar.textContent = 'Confirmar envio';
    confirmar.disabled = true;

    confirmar.style.cssText = `
  width: 100%;
  margin-top: 16px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  color: white;
  background: #087f5b;
  border: none;
  border-radius: 12px;
  cursor: pointer;
`;

    function atualizarVisor() {
      visor.textContent =
        '● '.repeat(digitados) +
        '○ '.repeat(6 - digitados);

      confirmar.disabled = digitados !== 6;
    }

    pares.forEach((par) => {
      const tecla = document.createElement('button');
      tecla.type = 'button';
      tecla.textContent = par;
      tecla.style.cssText = `
  min-height: 82px;
  padding: 18px 12px;
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
  background: #173b75;
  border: 2px solid #315b98;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 4px 0 #0c244b;
`;

      tecla.onclick = () => {
        if (digitados < 6) {
          digitados++;
          atualizarVisor();
        }
      };

      teclado.appendChild(tecla);
    });

    const apagar = document.createElement('button');
    apagar.type = 'button';
    apagar.textContent = 'Apagar';
    apagar.onclick = () => {
      if (digitados > 0) {
        digitados--;
        atualizarVisor();
      }
    };

    const cancelar = document.createElement('button');
    cancelar.type = 'button';
    cancelar.textContent = 'Cancelar';
    cancelar.style.cssText = `
  margin: 12px 8px;
  padding: 10px 18px;
  font-size: 15px;
  color: #173b75;
  background: #edf2f8;
  border: 1px solid #ccd5e0;
  border-radius: 10px;
  cursor: pointer;
`;

    function fechar(resultado) {
      fundo.remove();
      resolver(resultado);
    }

    cancelar.onclick = () => fechar(false);
    confirmar.onclick = () => fechar(true);

    atualizarVisor();

    painel.append(
      titulo,
      aviso,
      visor,
      teclado,
      apagar,
      confirmar,
      cancelar
    );

    fundo.appendChild(painel);
    document.body.appendChild(fundo);
  });
}
</script>

<script>
  async function verificarUsuario() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
      window.location.href = "login.html";
      return;
    }

    console.log("Usuário autenticado:", data.user.id);
  }

console.log("Teste: script de autenticação carregado");
verificarUsuario();
</script>
</body>
</html>
